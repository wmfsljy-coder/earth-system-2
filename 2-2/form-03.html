<!DOCTYPE html>
<html lang="ko">
<head>

<title>형성평가 · 기압의 연직 분포와 정역학적 균형 (지구시스템과학 Ⅱ-2 03)</title>
<link rel="icon" href="https://wmfsljy-coder.github.io/science-teacher-hub-qtrqwc/assets/hub-icon.svg" type="image/svg+xml">
</head>
<body>
<script>
/* 형성평가 — 지구시스템과학 Ⅱ-2 03 기압의 연직 분포와 정역학적 균형. 값은 단원 화면과 칠판 강의 화면(board-03.html)에 맞춘다. ref = 칠판 장면 번호
   기압: 표준 대기 모형(단원 화면과 같은 식) · 5.5 km 약 505 hPa · 16 km 약 103 hPa · 밀도 1.2 kg/m³ · g = 9.8 m/s² */
(function () {
  function p(z) { return z <= 11000 ? 1013.25 * Math.pow(1 - 0.0065 * z / 288.15, 5.2559) : 226.32 * Math.exp(-(z - 11000) / 6341.6); }
  var X = function (hpa) { return 70 + hpa * 0.52; }, Y = function (km) { return 205 - 9.25 * km; };
  var g = "<svg viewBox='0 0 640 250' width='640' height='250' aria-label='높이 0~20 km에서 기압이 아래쪽에서 빠르게, 위쪽에서 천천히 줄어드는 곡선'>";
  [5, 10, 15, 20].forEach(function (k) { g += "<line x1='70' y1='" + Y(k) + "' x2='600' y2='" + Y(k) + "' stroke='#e3e8ef' stroke-width='1.5'/><text x='62' y='" + (Y(k) + 5) + "' font-size='13' font-weight='800' fill='#5f6b80' text-anchor='end'>" + k + "</text>"; });
  [0, 200, 400, 600, 800, 1000].forEach(function (h) { g += "<text x='" + X(h) + "' y='" + (Y(0) + 20) + "' font-size='13' font-weight='800' fill='#5f6b80' text-anchor='middle'>" + h.toLocaleString() + "</text>"; });
  g += "<path d='M70 12 V205 H610' fill='none' stroke='#161b28' stroke-width='2'/><text x='62' y='210' font-size='13' font-weight='800' fill='#5f6b80' text-anchor='end'>0</text>";
  var pts = []; for (var z = 0; z <= 20.001; z += 0.25) pts.push(X(p(z * 1000)).toFixed(1) + "," + Y(z).toFixed(1));
  g += "<polyline points='" + pts.join(" ") + "' fill='none' stroke='#1462d8' stroke-width='3.5'/>";
  g += "<text x='610' y='246' font-size='12' font-weight='800' fill='#5f6b80' text-anchor='end'>기압 (hPa)</text><text x='76' y='12' font-size='12' font-weight='800' fill='#5f6b80'>높이 (km)</text></svg>";

  window.FORMATIVE = {
    subject: "지구시스템과학", unit: "Ⅱ-2 강수 과정과 대기의 운동", part: "03 기압의 연직 분포와 정역학적 균형",
    std: ["12지시03-04"], board: "board-03.html", sheet: "sheet-03.html", time: "10분",
    items: [
      { lv: "기본", type: "mc", ref: 4,
        q: "어떤 높이에서 잰 기압이 뜻하는 것으로 가장 알맞은 것은?",
        opts: ["그 높이에 있는 공기 분자의 평균 속력", "그 높이 위에 쌓인 공기 기둥의 무게(단위 넓이마다)", "그 높이 아래에 있는 공기 전체의 무게", "그 높이의 기온"],
        a: 1, why: "기압은 그 위에 쌓인 공기 기둥이 단위 넓이를 누르는 힘입니다. 위로 갈수록 머리 위 공기가 줄어 기압이 낮아집니다." },
      { lv: "기본", type: "short", ref: 5, unit: "km",
        q: "기압이 지표 기압의 약 1/10로 줄어드는 높이는 약 몇 km일까요?",
        a: ["16"], why: "약 16 km입니다. 절반이 되는 높이는 약 5.5 km입니다." },
      { lv: "기본", type: "mc", ref: 7,
        q: "정역학적 균형 상태에서 크기가 같고 방향이 반대인 두 힘은?",
        opts: ["기압 경도력과 전향력", "연직 기압 경도력과 중력", "원심력과 중력", "마찰력과 기압 경도력"],
        a: 1, why: "아래 면과 위 면의 기압 차로 생기는 위쪽 힘(연직 기압 경도력)이 공기의 무게(중력)와 맞섭니다. 기압 경도력과 전향력의 평형은 수평 방향의 지균풍입니다." },
      { lv: "발전", type: "mc", ref: 6, fig: g,
        q: "그림은 높이에 따른 기압을 나타낸 것입니다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
        box: "ㄱ. 0~1 km 사이에서 떨어지는 기압이 10~11 km 사이에서보다 크다.<br>ㄴ. 높이 올라갈수록 공기의 밀도가 커진다.<br>ㄷ. 기압이 약 500 hPa인 높이는 약 5.5 km이다.",
        opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
        a: 2, why: "0~1 km는 약 114 hPa, 10~11 km는 약 38 hPa 떨어집니다. 아래쪽 공기가 위의 공기에 눌려 밀도가 크기 때문이며, 위로 갈수록 밀도는 작아집니다." },
      { lv: "발전", type: "short", ref: 8, unit: "hPa",
        q: "공기 밀도가 1.2 kg/m³인 지표 부근에서, 높이 차가 50 m인 두 지점의 기압 차는 약 몇 hPa일까요? (중력 가속도 9.8 m/s², 정역학적 균형)",
        a: ["6", "5.9", "5.88"], why: "Δp = ρgΔz = 1.2 × 9.8 × 50 = 588 N/m² = 588 Pa ≈ 약 6 hPa입니다. 100 m에 약 12 hPa이니 그 절반입니다." },
      { lv: "발전", type: "mc", ref: 10,
        q: "대기의 연직 운동에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
        box: "ㄱ. 지상 저기압 중심으로 모여든 공기는 위로 올라가 상승 기류가 된다.<br>ㄴ. 고기압에서 가라앉는 공기는 단열 압축으로 식어 구름이 생기기 쉽다.<br>ㄷ. 산비탈을 타고 오르는 바람도 상승 기류를 만든다.",
        opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
        a: 2, why: "가라앉는 공기는 단열 압축으로 데워지므로 구름이 사라지고 맑습니다. 수렴과 지형은 모두 공기를 들어 올리는 원인입니다." },
      { lv: "심화", type: "mc", ref: 12,
        q: "여름 오후 좁은 지역에 갑자기 쏟아진 소나기와, 저기압이 지나가며 넓은 지역에 하루 종일 내린 비를 비교한 것으로 가장 알맞은 것은?",
        opts: ["소나기는 지표 가열로 초속 몇 m의 빠른 상승, 저기압의 비는 수렴으로 초속 몇 cm의 느린 상승 때문이다", "소나기는 수렴으로 초속 몇 cm의 상승, 저기압의 비는 지표 가열로 초속 몇 m의 상승 때문이다", "두 경우 모두 하강 기류 때문이다", "두 경우 모두 상승 속도가 같고 넓이만 다르다"],
        a: 0, why: "지표 가열은 좁은 곳에서 초속 몇 m로 솟아 소나기구름을 만들고, 수렴은 수백 km에 걸쳐 초속 몇 cm로 천천히 올라 넓은 구름대를 만듭니다. 상승 속도는 100배 넘게 다릅니다." },
      { lv: "심화", type: "essay", ref: 9,
        q: "공기에는 무게가 있어 중력이 계속 아래로 잡아당기는데도, 대기는 지표로 쏟아져 얇게 깔리지 않고 수십 km 높이까지 퍼져 있습니다. 그 까닭을 ‘기압’, ‘연직 기압 경도력’, ‘정역학적 균형’이라는 말을 넣어 설명하세요.",
        model: "기압은 그 위에 쌓인 공기 기둥의 무게이므로 아래로 갈수록 기압이 크다. 그래서 공기 층 하나를 떼어 보면 아래 면이 위로 미는 힘이 위 면이 누르는 힘보다 크고, 그 차이인 연직 기압 경도력이 위쪽으로 작용한다. 이 힘이 공기의 무게(중력)와 크기가 같아 정역학적 균형을 이루므로, 공기는 위아래로 움직이지 않고 층을 이룬 채 퍼져 있다.",
        rubric: ["기압이 그 위 공기 기둥의 무게라서 아래로 갈수록 크다고 썼다", "위아래 기압 차로 위쪽을 향하는 연직 기압 경도력이 생긴다고 썼다", "연직 기압 경도력과 중력이 같은 정역학적 균형이라 쏟아지지 않는다고 설명했다"] }
    ]
  };
})();
</script>
