<script>
/* 형성평가 — 지구시스템과학 Ⅱ-2 01 대기의 선택적 흡수와 열수지. 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호
   열수지(태양 복사 100): 반사 30 · 대기·구름 흡수 25 · 지표 흡수 45 · 지표 복사 104 · 대기의 창 8 · 숨은열 20 · 대류·전도 9 · 재복사 88 · 대기 방출 62 */
window.FORMATIVE = {
  subject: "지구시스템과학", unit: "Ⅱ-2 강수 과정과 대기의 운동", part: "01 대기의 선택적 흡수와 열수지",
  std: ["12지시03-01", "12지시03-02"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 5,
      q: "빛의 종류와, 그 빛에 대한 대기의 행동을 옳게 짝지은 것은?",
      opts: ["자외선(0.3 µm 미만) — 오존이 거의 모두 흡수한다", "가시광선 — 수증기가 대부분 흡수한다", "8~12 µm 적외선 — 이산화 탄소가 거의 모두 흡수한다", "5 µm 이상 적외선 — 대부분 그대로 통과한다"],
      a: 0, why: "가시광선은 대부분 통과하고, 5 µm 이상 적외선은 수증기·이산화 탄소가 대부분 흡수합니다. 다만 8~12 µm는 거의 통과하는 ‘대기의 창’입니다." },
    { lv: "기본", type: "short", ref: 5,
      q: "지구가 내보내는 적외선 가운데 8~12 µm 파장은 대기에 거의 흡수되지 않고 우주로 빠져나갑니다. 이 파장대를 무엇이라고 할까요?",
      a: ["대기의 창", "대기의창"], why: "대기의 창입니다. 지구가 우주로 열을 내보내는 통로 구실을 합니다." },
    { lv: "기본", type: "mc", ref: 4,
      q: "태양 복사와 지구 복사를 비교한 것으로 옳은 것은?",
      opts: ["태양 복사는 파장이 짧은 단파 복사, 지구 복사는 파장이 긴 장파 복사(적외선)이다", "둘 다 가시광선 영역에서 가장 강하다", "지구 복사가 태양 복사보다 파장이 짧다", "지구는 태양 빛을 반사할 뿐 스스로 복사를 내보내지 않는다"],
      a: 0, why: "약 5,800 K인 태양은 0.5 µm 부근, 약 288 K인 지구는 10 µm 부근에서 가장 강하게 복사합니다. 온도가 있는 물체는 모두 복사를 내보냅니다." },
    { lv: "발전", type: "short", ref: 8, unit: "W/m²",
      q: "태양 상수가 1,600 W/m²이고 반사율이 0.3인 행성이 있습니다. 이 행성의 겉면 1 m²가 평균으로 흡수하는 태양 에너지 S(1 − A) ÷ 4는 몇 W/m²일까요?",
      a: ["280"], why: "1,600 × 0.7 ÷ 4 = 280 W/m²입니다. 햇빛은 원판 넓이(πR²)로 받지만 공 전체 겉넓이(4πR²)로 나누어 내보내므로 4로 나눕니다." },
    { lv: "발전", type: "mc", ref: 9,
      q: "온실 효과에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 대기가 없다면 지구의 복사 평형 온도는 약 −18 ℃이다.<br>ㄴ. 온실 효과는 생명에 해로운 현상이므로 없을수록 좋다.<br>ㄷ. 대기가 흡수한 지구 복사를 지표로 다시 내보내기(재복사) 때문에 생긴다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "온실 효과 덕분에 지구 평균 기온이 −18 ℃가 아니라 약 15 ℃이고, 물이 액체로 있을 수 있습니다. 문제가 되는 것은 온실 기체가 늘어 강화된 온실 효과입니다." },
    { lv: "발전", type: "mc", ref: 12,
      q: "어느 행성의 대기권 밖에서 본 에너지 수지입니다. 들어온 태양 복사를 100으로 할 때, 반사되어 나간 양이 31, 대기의 창으로 빠져나간 지표 복사가 12입니다. 이 행성이 복사 평형이라면 대기와 구름이 우주로 내보내는 복사는?",
      opts: ["43", "57", "69", "88"],
      a: 1, why: "들어온 것 = 나간 것이므로 100 = 31 + 12 + ①, ① = 57입니다. 지구 값(반사 30, 대기의 창 8)으로는 62입니다." },
    { lv: "심화", type: "mc", ref: 11,
      q: "온실 기체가 늘어 대기가 지표로 돌려보내는 재복사가 88에서 90으로 늘었습니다. 지표가 흡수하는 태양 복사(45), 숨은열(20), 대류·전도(9)가 그대로라면, 지표가 다시 평형을 이루려면 지표 복사는 얼마가 되어야 할까요?",
      opts: ["102", "104", "106", "108"],
      a: 2, why: "지표의 장부: 45 + 90 = 지표 복사 + 20 + 9, 지표 복사 = 106입니다. 지표 복사가 104에서 106으로 커지려면 지표 온도가 올라가야 합니다. 이것이 강화된 온실 효과입니다." },
    { lv: "심화", type: "essay", ref: 9,
      q: "구름 없이 맑은 밤보다 구름이 잔뜩 낀 밤에 기온이 덜 내려갑니다. 그 까닭을 ‘지구 복사’, ‘대기의 창’, ‘재복사’라는 말을 넣어 설명하세요.",
      model: "지표는 밤에도 적외선인 지구 복사를 내보낸다. 맑은 밤에는 그 가운데 대기의 창(8~12 µm) 파장이 거의 그대로 우주로 빠져나가 지표가 빠르게 식는다. 구름이 끼면 구름이 지구 복사를 흡수했다가 지표 쪽으로 재복사하므로, 지표가 잃는 에너지가 줄어 기온이 덜 내려간다.",
      rubric: ["지표가 밤에도 지구 복사(적외선)를 내보낸다고 썼다", "맑은 밤에는 대기의 창으로 열이 우주로 빠져나간다고 썼다", "구름이 지구 복사를 흡수해 지표로 재복사하므로 덜 식는다고 설명했다"] }
  ]
};
</script>
