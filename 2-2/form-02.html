<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>형성평가 · 단열 변화와 대기 안정도 (지구시스템과학 Ⅱ-2 02)</title>
<link rel="icon" href="https://wmfsljy-coder.github.io/science-teacher-hub-qtrqwc/assets/hub-icon.svg" type="image/svg+xml">
</head>
<body>
<script>
/* 형성평가 — 지구시스템과학 Ⅱ-2 02 단열 변화와 대기 안정도. 값은 단원 화면과 칠판 강의 화면(board-02.html)에 맞춘다. ref = 칠판 장면 번호
   건조 단열 감률 1.0 ℃/100 m · 습윤 단열 감률 0.5 ℃/100 m · 이슬점 감률 0.2 ℃/100 m · 상승 응결 고도 ≈ 125 × (기온 − 이슬점) m */
(function () {
  /* 어느 날 아침의 기온 연직 분포: 0 m 8 ℃ → 400 m 12 ℃ → 1,200 m 7.2 ℃ (400 m 위는 0.6 ℃/100 m) */
  var X = function (t) { return 60 + 28 * t; }, Y = function (z) { return 200 - 0.15 * z; };
  var g = "<svg viewBox='0 0 660 236' width='660' height='236' aria-label='높이 0 m에서 8 ℃, 400 m에서 12 ℃로 올라갔다가 그 위로는 다시 낮아지는 기온 분포'>";
  [400, 800, 1200].forEach(function (z) { g += "<line x1='60' y1='" + Y(z) + "' x2='620' y2='" + Y(z) + "' stroke='#e3e8ef' stroke-width='1.5'/><text x='52' y='" + (Y(z) + 5) + "' font-size='13' font-weight='800' fill='#5f6b80' text-anchor='end'>" + z.toLocaleString() + "</text>"; });
  [0, 5, 10, 15, 20].forEach(function (t) { g += "<text x='" + X(t) + "' y='" + (Y(0) + 20) + "' font-size='13' font-weight='800' fill='#5f6b80' text-anchor='middle'>" + t + "</text>"; });
  g += "<path d='M60 14 V200 H630' fill='none' stroke='#161b28' stroke-width='2'/><text x='52' y='205' font-size='13' font-weight='800' fill='#5f6b80' text-anchor='end'>0</text>";
  g += "<polyline points='" + X(8) + "," + Y(0) + " " + X(12) + "," + Y(400) + " " + X(7.2) + "," + Y(1200) + "' fill='none' stroke='#1462d8' stroke-width='3.5'/>";
  g += "<text x='" + (X(12) + 10) + "' y='" + (Y(400) + 5) + "' font-size='13' font-weight='800' fill='#1462d8'>400 m · 12 ℃</text><text x='" + (X(8) + 10) + "' y='" + (Y(0) - 8) + "' font-size='13' font-weight='800' fill='#1462d8'>8 ℃</text>";
  g += "<text x='630' y='232' font-size='12' font-weight='800' fill='#5f6b80' text-anchor='end'>기온 (℃)</text><text x='66' y='12' font-size='12' font-weight='800' fill='#5f6b80'>높이 (m)</text></svg>";

  window.FORMATIVE = {
    subject: "지구시스템과학", unit: "Ⅱ-2 강수 과정과 대기의 운동", part: "02 단열 변화와 대기 안정도",
    std: ["12지시03-03"], board: "board-02.html", sheet: "sheet-02.html", time: "10분",
    items: [
      { lv: "기본", type: "mc", ref: 4,
        q: "맑은 날 공기 덩어리가 위로 올라가면 기온이 낮아집니다. 그 까닭으로 가장 알맞은 것은?",
        opts: ["높이 올라갈수록 태양에서 멀어지기 때문", "주변 기압이 낮아져 부피가 커지면서 스스로 에너지를 쓰기 때문", "위쪽의 차가운 공기에 열을 빼앗기기 때문", "구름이 햇빛을 가리기 때문"],
        a: 1, why: "단열 팽창입니다. 덩어리는 주변과 열을 거의 주고받지 않고, 부풀면서 주변 공기를 밀어내는 일을 하느라 식습니다. 몇 km 오른다고 태양과의 거리가 달라지는 효과는 없습니다." },
      { lv: "기본", type: "short", ref: 6, unit: "m",
        q: "지표에서 기온이 24 ℃, 이슬점이 18 ℃인 공기 덩어리가 올라갑니다. 구름이 생기기 시작하는 높이(상승 응결 고도)는 약 몇 m일까요?",
        a: ["750"], why: "125 × (24 − 18) = 125 × 6 = 750 m입니다. 100 m마다 기온은 1.0 ℃, 이슬점은 0.2 ℃씩 낮아져 차가 0.8 ℃씩 줄어듭니다." },
      { lv: "기본", type: "mc", ref: 5,
        q: "구름 속(포화) 공기 덩어리가 맑은(불포화) 공기 덩어리보다 올라갈 때 천천히 식는 까닭은?",
        opts: ["구름이 햇빛을 흡수해 데워 주기 때문", "수증기가 응결하면서 숨은열을 내놓기 때문", "구름 속 공기가 더 무거워 덜 팽창하기 때문", "구름 속에서는 이슬점이 오르기 때문"],
        a: 1, why: "응결할 때 나오는 숨은열(응결 잠열)이 식는 만큼의 일부를 채워 줍니다. 그래서 습윤 단열 감률(약 0.5 ℃/100 m)이 건조 단열 감률(1.0 ℃/100 m)보다 작습니다." },
      { lv: "발전", type: "mc", ref: 10,
        q: "주변 대기의 기온 감률이 0.9 ℃/100 m인 날입니다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
        box: "ㄱ. 불포화 공기 덩어리를 들어 올리면 제자리로 되돌아온다.<br>ㄴ. 구름 속의 포화된 공기 덩어리는 계속 올라간다.<br>ㄷ. 이 대기는 절대 안정하다.",
        opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
        a: 2, why: "0.9는 0.5와 1.0 사이이므로 조건부 불안정입니다. 불포화 덩어리는 1.0 ℃씩 식어 주변보다 차가워지니 되돌아오고, 포화 덩어리는 0.5 ℃씩만 식어 주변보다 따뜻하니 계속 올라갑니다." },
      { lv: "발전", type: "mc", ref: 11, fig: g,
        q: "그림은 어느 맑은 날 새벽의 기온 연직 분포입니다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
        box: "ㄱ. 0~400 m 구간은 높이 올라갈수록 기온이 높아진다.<br>ㄴ. 0~400 m 구간은 공기가 위아래로 잘 섞이는 불안정한 대기이다.<br>ㄷ. 이 구간에서는 안개나 오염 물질이 위로 잘 흩어지지 않는다.",
        opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
        a: 2, why: "0~400 m는 기온 역전층입니다. 들어 올린 공기 덩어리는 늘 주변보다 차가워 가라앉으므로 매우 안정하고, 안개와 오염 물질이 지표 가까이에 갇힙니다." },
      { lv: "발전", type: "short", ref: 13,
        q: "지표 기온 15 ℃, 기온 감률 0.6 ℃/100 m인 날, 꼭대기 높이가 2 km인 구름이 있습니다. 이 구름에서 빗방울이 자라는 방식을 무엇이라고 할까요?",
        a: ["병합설", "병합"], why: "꼭대기 기온은 15 − 0.6 × 20 = 3 ℃로 구름 전체가 0 ℃보다 따뜻합니다. 크기가 다른 물방울이 부딪쳐 합쳐지는 병합설입니다. 0 ℃ 고도는 15 ÷ 0.6 × 100 = 2,500 m입니다." },
      { lv: "심화", type: "mc", ref: 7,
        q: "기온 18 ℃, 이슬점 14 ℃인 공기가 높이 2,000 m인 산을 넘습니다. 산을 오르며 생긴 구름은 산마루까지 이어지고, 내려갈 때는 구름이 없습니다. 반대편 산기슭(높이 0 m)의 기온은?",
        opts: ["15.5 ℃", "18 ℃", "25.5 ℃", "28 ℃"],
        a: 2, why: "상승 응결 고도 125 × 4 = 500 m에서 13 ℃. 구름 속 1,500 m는 0.5 ℃씩 7.5 ℃ 식어 산마루 5.5 ℃. 내려올 때 2,000 m를 1.0 ℃씩 데워져 25.5 ℃입니다. 구름 구간 1,500 m × 0.5 ℃/100 m = 7.5 ℃만큼 더워졌습니다. 내려올 때도 0.5 ℃씩 데워진다고 하면 15.5 ℃라는 틀린 답이, 구름을 빼먹으면 18 ℃라는 틀린 답이 나옵니다." },
      { lv: "심화", type: "essay", ref: 8,
        q: "같은 산을 넘는 바람인데, 어떤 날은 산 너머 기온이 산기슭과 같고 어떤 날은 5 ℃ 넘게 더워집니다. 두 날의 차이를 ‘상승 응결 고도’, ‘구름 구간’, ‘습윤 단열 감률’이라는 말을 넣어 설명하세요.",
        model: "상승 응결 고도가 산마루보다 높은 날은 구름이 생기지 않아 오를 때와 내려올 때 모두 건조 단열 감률(1.0 ℃/100 m)을 따르므로 기온이 그대로이다. 상승 응결 고도가 낮은 날은 그 위 구름 구간에서 습윤 단열 감률(약 0.5 ℃/100 m)로 천천히 식고, 내려올 때는 구름 없이 1.0 ℃/100 m로 데워지므로 구름 구간 두께 × 0.5 ℃/100 m만큼 더워진다. 5 ℃ 넘게 더워지려면 구름 구간이 1,000 m보다 두꺼워야 한다.",
        rubric: ["구름이 생기지 않으면 오르내림 모두 건조 단열이라 기온이 같다고 썼다", "구름 구간에서는 습윤 단열 감률로 천천히 식고 내려올 때는 건조 단열로 데워진다고 썼다", "더워지는 정도가 구름 구간의 두께(상승 응결 고도의 높낮이)에 달렸다고 설명했다"] }
    ]
  };
})();
</script>
<script src="../assets/formative.js"></script>
</body>
</html>
