<script>
/* 형성평가 — 지구시스템과학 Ⅱ-1 03 해일. 값은 단원 화면과 칠판 강의 화면(board-03.html)에 맞춘다. ref = 칠판 장면 번호 */
(function () {
  window.FORMATIVE = {
    subject: "지구시스템과학", unit: "Ⅱ-1 해수의 운동", part: "03 해일",
    std: ["12지시02-03"], board: "board-03.html", sheet: "sheet-03.html", time: "10분",
    items: [
      { lv: "기본", type: "mc", ref: 4,
        q: "지진 해일을 일으키는 원인이 <b>아닌</b> 것은?",
        opts: ["해저 지진", "해저 화산 폭발", "해저 산사태", "태풍 중심의 낮은 기압"],
        a: 3, why: "지진 해일은 해저 바닥이 갑자기 움직여 바닷물 전체가 들렸다 내려앉으며 생깁니다. 태풍의 낮은 기압과 바람이 해수면을 높이는 것은 폭풍 해일입니다." },
      { lv: "기본", type: "short", ref: 9, unit: "cm",
        q: "태풍 중심의 기압이 1 hPa 낮아질 때마다 해수면은 약 몇 cm 올라갈까요?",
        a: ["1"], why: "기압이 1 hPa 낮아질 때 해수면은 약 1 cm 올라갑니다. 그래서 기압만으로는 900 hPa까지 낮아져도 약 1.13 m에 그치고, 바람과 만조가 겹쳐야 방조제를 넘을 수 있습니다." },
      { lv: "기본", type: "mc", ref: 5,
        q: "지진 해일이 수심 4,000 m인 먼바다에서도 천해파로 행동하는 까닭으로 옳은 것은?",
        opts: ["파고가 매우 높기 때문", "파장이 100 km 이상으로 길어 수심이 파장의 1/20보다 얕기 때문", "바람이 계속 불어 주기 때문", "해저 지진이 계속 일어나기 때문"],
        a: 1, why: "파장 100 km의 1/20은 5 km입니다. 수심 4 km는 그보다 얕으므로 지진 해일은 어디서나 천해파이고, 속도는 수심만이 정합니다. 먼바다의 파고는 오히려 1 m 안팎으로 낮습니다." },
      { lv: "발전", type: "short", ref: 6, unit: "m/s",
        q: "수심 250 m인 바다를 지나는 지진 해일의 속도는 약 몇 m/s일까요? (v = √(gh), g = 9.8 m/s², 소수 첫째 자리까지)",
        a: ["49.5", "약49.5"], why: "v = √(9.8 × 250) = √2,450 ≈ 49.5 m/s, 시속 약 178 km입니다." },
      { lv: "발전", type: "mc", ref: 7,
        q: "진원에서 해안까지의 단면 자료로 지진 해일의 도달 시간을 계산했습니다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
        box: "A 심해 150 km · 수심 5,000 m &nbsp;|&nbsp; B 대륙 사면 50 km · 1,000 m &nbsp;|&nbsp; C 대륙붕 12 km · 100 m<br>ㄱ. 해일의 속도는 A &gt; B &gt; C 순이다.<br>ㄴ. 지나는 데 가장 오래 걸리는 구간은 C이다.<br>ㄷ. 해안까지 걸리는 시간은 약 26분이다.",
        opts: ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"],
        a: 3, why: "속도는 A 221 m/s, B 99 m/s, C 31 m/s입니다. 걸린 시간은 A 678초, B 505초, C 383초로 A가 가장 오래 걸립니다(C는 1 km당 가장 느리지만 거리가 짧습니다). 모두 더하면 1,566초 ≈ 26분입니다." },
      { lv: "발전", type: "mc", ref: 9,
        q: "방조제의 높이가 3.0 m인 해안에 태풍이 다가옵니다. 단원 화면 모형으로 계산한 값이 다음과 같을 때, 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
        box: "중심 기압 960 hPa (평상시 1013 hPa) · 바람이 올린 높이 0.8 m · 천문 조위: 만조 때 1.8 m, 간조 때 0.2 m<br>ㄱ. 기압이 올린 높이는 약 0.53 m이다.<br>ㄴ. 태풍이 만조 때 오면 방조제를 넘는다.<br>ㄷ. 태풍이 간조 때 와도 방조제를 넘는다.",
        opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
        a: 2, why: "기압 효과는 (1013 − 960) × 1 cm = 53 cm입니다. 만조 때는 0.53 + 0.8 + 1.8 = 3.13 m로 방조제를 넘지만, 간조 때는 0.53 + 0.8 + 0.2 = 1.53 m로 넘지 못합니다. 같은 태풍이라도 만조와 겹치는지가 피해를 가릅니다." },
      { lv: "심화", type: "mc", ref: 10,
        q: "2003년 태풍 매미 때 마산항에서 기압과 바람이 올린 높이(해일고)는 약 2.3 m였지만, 검조소에 기록된 최고 해수면은 약 432 cm였습니다. 두 값의 차이를 만든 가장 중요한 요인은?",
        opts: ["태풍과 함께 일어난 해저 지진", "만조 무렵의 조석", "여름철 바닷물의 온도 상승", "쿠로시오 해류의 유속 증가"],
        a: 1, why: "폭풍 해일의 높이에 그때의 천문 조위가 더해집니다. 매미는 만조 무렵의 조석과 겹쳐 최고 해수면이 크게 높아졌고, 좁고 긴 만 안쪽의 마산 시가지가 잠겼습니다." },
      { lv: "심화", type: "essay", ref: 11,
        q: "지진 해일과 폭풍 해일은 경보를 미리 낼 수 있는 시간이 크게 다릅니다. 그 까닭을 설명하고, 이 차이 때문에 해안 주민의 대처 방법이 어떻게 달라야 하는지 각각 한 가지씩 제안하세요.",
        model: "지진 해일은 해저 지진이 일어나는 순간 시작되고 천해파로 매우 빠르게(수심 5,000 m에서 약 221 m/s) 달려와 해안까지 수십 분밖에 걸리지 않는다. 그래서 흔들림을 느끼면 방송을 기다리지 말고 곧장 높은 곳으로 대피해야 한다. 폭풍 해일은 원인인 태풍의 진로와 중심 기압을 며칠 전부터 예보할 수 있으므로, 만조 시각과 겹치는지 확인해 저지대 주민을 미리 대피시키고 어선을 옮겨 두는 등 사전에 준비한다.",
        rubric: ["지진 해일은 빠르게 와서 수십 분밖에 여유가 없다고 썼다", "폭풍 해일은 태풍을 며칠 전부터 예보할 수 있다고 썼다", "각 해일에 맞는 대처(즉시 높은 곳 대피 / 만조 확인과 사전 대피)를 제안했다"] }
    ]
  };
})();
</script>
