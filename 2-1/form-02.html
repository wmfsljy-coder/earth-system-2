<script>
/* 형성평가 — 지구시스템과학 Ⅱ-1 02 해파의 발생과 전파. 값은 단원 화면과 칠판 강의 화면(board-02.html)에 맞춘다. ref = 칠판 장면 번호 */
(function () {
  /* (가) 원 궤도가 깊을수록 작아짐(해저가 깊다), (나) 납작한 타원 궤도(해저가 가깝다) */
  var FIG_ORB = "<svg viewBox='0 0 660 250' width='660' height='250' aria-label='(가) 물 입자가 원을 그리며 깊을수록 원이 작아진다. (나) 물 입자가 납작한 타원을 그리고 해저 바로 위에서는 앞뒤로만 움직인다'>" +
    "<rect x='10' y='30' width='300' height='200' rx='10' fill='#e7f5ff'/><path d='M10 50 Q60 32 110 50 T210 50 T310 50' fill='none' stroke='#1864ab' stroke-width='3'/>" +
    "<g fill='none' stroke='#1462d8' stroke-width='2.5'><circle cx='160' cy='78' r='22'/><circle cx='160' cy='132' r='12'/><circle cx='160' cy='172' r='5'/><circle cx='160' cy='200' r='2'/></g>" +
    "<text x='160' y='20' font-size='16' font-weight='800' fill='#161b28' text-anchor='middle'>(가)</text>" +
    "<rect x='350' y='30' width='300' height='140' rx='10' fill='#e7f5ff'/><rect x='350' y='170' width='300' height='20' fill='#c9b48a'/>" +
    "<path d='M350 50 Q400 32 450 50 T550 50 T650 50' fill='none' stroke='#1864ab' stroke-width='3'/>" +
    "<g fill='none' stroke='#1462d8' stroke-width='2.5'><ellipse cx='500' cy='78' rx='38' ry='20'/><ellipse cx='500' cy='122' rx='36' ry='10'/><line x1='464' y1='162' x2='536' y2='162'/></g>" +
    "<text x='500' y='20' font-size='16' font-weight='800' fill='#161b28' text-anchor='middle'>(나)</text>" +
    "<text x='500' y='210' font-size='13' font-weight='800' fill='#5c4a2c' text-anchor='middle'>해저</text>" +
    "<text x='650' y='246' font-size='12' fill='#8a94a6' text-anchor='end'>궤도 크기와 수심은 과장함</text></svg>";

  window.FORMATIVE = {
    subject: "지구시스템과학", unit: "Ⅱ-1 해수의 운동", part: "02 해파의 발생과 전파",
    std: ["12지시02-02"], board: "board-02.html", sheet: "sheet-02.html", time: "10분",
    items: [
      { lv: "기본", type: "mc", ref: 5,
        q: "바람이 만드는 파도(풍랑)의 크기를 정하는 조건이 <b>아닌</b> 것은?",
        opts: ["바람의 세기(풍속)", "바람이 같은 방향으로 불어 간 거리(취송 거리)", "바람이 분 시간(지속 시간)", "그 바다의 수온"],
        a: 3, why: "파고는 풍속·취송 거리·지속 시간 세 가지가 함께 정하고, 셋 중 하나만 모자라도 더 자라지 못합니다." },
      { lv: "기본", type: "short", ref: 4,
        q: "바람이 부는 해역을 벗어나 바람 없이 전파되는, 마루가 둥글고 파장이 긴 파도를 무엇이라고 할까요?",
        a: ["너울"], why: "바람이 부는 해역 안의 뾰족하고 불규칙한 파도는 풍랑, 그곳을 벗어난 둥글고 긴 파도는 너울입니다. 서핑 대회의 파도는 3,600 km 떨어진 저기압에서 온 너울이었습니다." },
      { lv: "기본", type: "mc", ref: 8,
        q: "파도가 천해파로 행동하는 조건으로 옳은 것은?",
        opts: ["수심이 파장의 1/2보다 깊다", "수심이 파장의 1/2보다 얕다", "수심이 파장의 1/20보다 얕다", "수심이 파고보다 얕다"],
        a: 2, why: "수심이 파장의 1/20보다 얕으면 천해파, 1/2보다 깊으면 심해파, 그 사이는 전이대입니다." },
      { lv: "발전", type: "mc", ref: 6,
        q: "깊은 바다에서 너울 A의 파장은 너울 B의 4배입니다. A의 속도는 B의 몇 배일까요? (심해파 속도 c = √(gL ÷ 2π))",
        opts: ["4배", "2배", "같다", "파고가 더 높은 쪽이 빠르다"],
        a: 1, why: "심해파의 속도는 파장의 제곱근에 비례하므로 √4 = 2배입니다. 속도는 파고와 관계없습니다." },
      { lv: "발전", type: "short", ref: 9, unit: "m/s",
        q: "수심 40 m인 곳을 천해파가 지나고 있습니다. 이 천해파의 속도는 약 몇 m/s일까요? (g = 9.8 m/s², 소수 첫째 자리까지)",
        a: ["19.8", "약19.8"], why: "v = √(gh) = √(9.8 × 40) = √392 ≈ 19.8 m/s입니다. 천해파의 속도는 파장과 관계없이 수심만으로 정해집니다." },
      { lv: "발전", type: "mc", ref: 8, fig: FIG_ORB,
        q: "그림 (가), (나)는 두 파도가 지날 때 물 입자의 운동 궤도입니다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
        box: "ㄱ. (가)는 심해파이다.<br>ㄴ. (나)의 속도는 파장이 길수록 빠르다.<br>ㄷ. (나)에서는 물 입자의 운동이 해저까지 미친다.",
        opts: ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"],
        a: 3, why: "(가)는 원 궤도가 깊을수록 작아지는 심해파, (나)는 해저에 눌린 납작한 타원 궤도의 천해파입니다. 천해파의 속도는 파장이 아니라 수심이 정합니다." },
      { lv: "심화", type: "mc", ref: 7,
        q: "같은 폭풍에서 파장 280 m와 파장 70 m인 너울이 동시에 출발했습니다. 파장 280 m 너울은 3,600 km를 약 48시간에 건넙니다. 파장 70 m 너울은 약 몇 시간 걸릴까요? (둘 다 심해파)",
        opts: ["약 48시간 (동시에 도착)", "약 24시간", "약 96시간", "약 192시간"],
        a: 2, why: "심해파 속도는 √L에 비례합니다. 파장이 1/4이면 속도는 1/2, 걸리는 시간은 2배이므로 약 96시간입니다. 그래서 폭풍 뒤에는 긴 너울부터 도착합니다." },
      { lv: "심화", type: "essay", ref: 10,
        q: "바람이 거의 없는 해수욕장에 높은 파도가 들어와 해안 가까이에서 부서지고 있습니다. 파도가 어디서 왔고, 해안에서 왜 높아져 부서지는지 '너울', '천해파', '파장'이라는 말을 넣어 설명하세요.",
        model: "이 파도는 먼 바다의 강한 바람이 만든 풍랑이 바람 해역을 벗어나 너울이 되어 건너온 것이다. 해안에 가까워져 수심이 파장의 1/20보다 얕아지면 천해파가 되어 속도가 √(gh)로 줄어든다. 느려진 만큼 파장이 짧아지고 에너지가 좁은 곳에 몰려 파고가 커지며(천수 효과), 파고가 수심의 약 0.8배에 이르면 물마루가 앞으로 무너진다.",
        rubric: ["먼 바다에서 만들어진 너울이 건너왔다고 썼다", "얕은 곳에서 천해파가 되어 속도가 줄어든다고 썼다", "파장이 짧아지고 파고가 커져 부서진다고 썼다"] }
    ]
  };
})();
