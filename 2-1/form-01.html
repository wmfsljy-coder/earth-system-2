<title>형성평가 · 에크만 수송과 지형류 (지구시스템과학 Ⅱ-1 01)</title>
<link rel="icon" href="https://wmfsljy-coder.github.io/science-teacher-hub-qtrqwc/assets/hub-icon.svg" type="image/svg+xml">
</head>
<body>
<script>
/* 형성평가 — 지구시스템과학 Ⅱ-1 01 에크만 수송과 지형류. 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호 */
(function () {
  /* 환류 중심을 지나는 단면: 가운데 해수면이 높다(과장). A 가장자리, B 중심, 같은 수심 */
  var FIG_SEC = "<svg viewBox='0 0 660 230' width='660' height='230' aria-label='가운데 해수면이 높은 바다의 단면. 같은 수심에 가장자리 A와 중심 B가 있다'>" +
    "<path d='M30 80 Q330 10 630 80 L630 200 L30 200 Z' fill='#a5d8ff'/>" +
    "<line x1='30' y1='80' x2='630' y2='80' stroke='#161b28' stroke-width='1.5' stroke-dasharray='6 5'/>" +
    "<line x1='30' y1='150' x2='630' y2='150' stroke='#1864ab' stroke-width='1.5' stroke-dasharray='4 4'/>" +
    "<circle cx='110' cy='150' r='8' fill='#161b28'/><text x='110' y='180' font-size='16' font-weight='800' fill='#161b28' text-anchor='middle'>A</text>" +
    "<circle cx='330' cy='150' r='8' fill='#161b28'/><text x='330' y='180' font-size='16' font-weight='800' fill='#161b28' text-anchor='middle'>B</text>" +
    "<text x='620' y='142' font-size='13' font-weight='800' fill='#1864ab' text-anchor='end'>같은 수심</text>" +
    "<text x='330' y='26' font-size='14' font-weight='800' fill='#161b28' text-anchor='middle'>환류 중심</text>" +
    "<text x='40' y='70' font-size='14' font-weight='800' fill='#161b28'>가장자리</text>" +
    "<text x='630' y='222' font-size='12' fill='#8a94a6' text-anchor='end'>해수면 높이 차는 크게 과장함</text></svg>";

  window.FORMATIVE = {
    subject: "지구시스템과학", unit: "Ⅱ-1 해수의 운동", part: "01 에크만 수송과 지형류",
    std: ["12지시02-01"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
    items: [
      { lv: "기본", type: "mc", ref: 5,
        q: "북반구 바다에서 바람이 오랫동안 불 때, 표층 해수 전체가 옮겨 가는 방향(에크만 수송)으로 옳은 것은?",
        opts: ["바람이 부는 방향과 같다", "바람이 부는 방향의 오른쪽 직각", "바람이 부는 방향의 왼쪽 직각", "바람이 부는 방향과 정반대"],
        a: 1, why: "북반구에서는 전향력이 오른쪽으로 작용해 표층 해수는 오른쪽 45°, 층 전체를 합한 에크만 수송은 오른쪽 90°로 옮겨 갑니다. 바람 방향 그대로 가지 않습니다." },
      { lv: "기본", type: "short", ref: 8,
        q: "수압 경도력과 전향력이 평형을 이루어 등수압선과 나란하게 흐르는 해류를 무엇이라고 할까요?",
        a: ["지형류"], why: "물은 처음에 수압 경도력을 받아 낮은 쪽으로 움직이지만, 전향력에 휘어 결국 두 힘이 맞서는 방향, 곧 등수압선과 나란한 방향으로 흐릅니다." },
      { lv: "기본", type: "mc", ref: 10,
        q: "북태평양 아열대 환류의 서쪽 가장자리를 흐르는 해류(서안 경계류)에 대한 설명으로 옳은 것은?",
        opts: ["폭이 넓고 느리며 얕다", "찬 해수를 저위도로 나른다", "폭이 좁고 빠르며 깊다", "캘리포니아 해류가 대표적이다"],
        a: 2, why: "서안 경계류(쿠로시오, 멕시코만류)는 좁고 빠르고 깊으며 따뜻한 물을 고위도로 나릅니다. 넓고 느리고 얕은 것은 캘리포니아 해류 같은 동안 경계류입니다." },
      { lv: "발전", type: "short", ref: 7, unit: "기압",
        q: "해수면에서 대기압은 1기압이고, 바닷물 속에서는 수심 10 m마다 수압이 약 1기압씩 커집니다(정역학 평형). 수심 300 m에서 수압은 약 몇 기압일까요?",
        a: ["31"], why: "1 + 300 ÷ 10 = 31기압입니다. 위에 있는 물의 무게가 그대로 수압이 됩니다. 대기압 1기압을 더하는 것을 빠뜨리면 30기압이 됩니다." },
      { lv: "발전", type: "mc", ref: 5,
        q: "남반구의 어느 바다에서 바람이 동쪽으로 불고 있습니다. 이때 에크만 수송의 방향은?",
        opts: ["동쪽", "서쪽", "남쪽", "북쪽"],
        a: 3, why: "남반구에서는 전향력이 왼쪽으로 작용해 에크만 수송은 바람의 왼쪽 90°입니다. 동쪽을 보고 섰을 때 왼쪽은 북쪽입니다. 북반구였다면 오른쪽인 남쪽이었을 것입니다." },
      { lv: "발전", type: "mc", ref: 7, fig: FIG_SEC,
        q: "그림은 북반구 아열대 바다에서 환류 중심을 지나도록 자른 단면입니다. A와 B는 같은 수심에 있습니다. 이에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
        box: "ㄱ. 수압은 B가 A보다 크다.<br>ㄴ. 수압 경도력은 A에서 B 쪽으로 작용한다.<br>ㄷ. 이 바다의 지형류는 해수면이 높은 쪽을 오른쪽에 두고 흐른다.",
        opts: ["ㄱ", "ㄴ", "ㄱ, ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ"],
        a: 3, why: "B 위에는 물이 더 쌓여 있어 같은 수심이라도 수압이 큽니다. 수압 경도력은 수압이 높은 B에서 낮은 A 쪽으로 향합니다. 북반구 지형류는 높은 쪽을 오른쪽에 두고 흘러 시계 방향 환류가 됩니다." },
      { lv: "심화", type: "mc", ref: 9,
        q: "칠판 화면의 계산에서 환류 중심과 가장자리의 해수면 높이차가 1 m일 때 지형류의 유속은 약 6.7 cm/s였습니다(v = g·Δh ÷ (f·L)). 위도와 거리는 그대로이고 높이차만 0.5 m로 줄면 유속은 약 얼마일까요?",
        opts: ["약 1.7 cm/s", "약 3.4 cm/s", "약 6.7 cm/s", "약 13.4 cm/s"],
        a: 1, why: "유속은 해수면 높이차 Δh에 비례합니다. 높이차가 절반이면 유속도 절반, 6.7 ÷ 2 ≈ 3.4 cm/s입니다." },
      { lv: "심화", type: "essay", ref: 12,
        q: "북태평양 편서풍대에 쏟아진 고무 오리들이 바람이 부는 쪽으로 곧장 가지 않고, 큰 원을 그리는 해류를 따라 움직인 까닭을 '에크만 수송', '수압 경도력', '전향력'이라는 말을 넣어 차례대로 설명하세요.",
        model: "편서풍과 무역풍이 불면 에크만 수송이 바람의 오른쪽 직각으로 일어나 아열대 한가운데로 물이 모이고, 그곳의 해수면이 약 1 m 높아진다. 그러면 같은 깊이에서 중심의 수압이 커져 중심에서 가장자리로 수압 경도력이 작용한다. 움직이기 시작한 해수는 전향력에 오른쪽으로 휘어, 두 힘이 평형을 이루는 등수압선 방향으로 흐르는 지형류가 되고, 이것이 시계 방향 환류를 만들어 오리들이 그 길을 따라 돌았다.",
        rubric: ["바람에 의한 에크만 수송으로 아열대 중심에 물이 쌓여 해수면이 높아진다고 썼다", "같은 깊이에서 수압 차이로 수압 경도력이 생긴다고 썼다", "전향력과 수압 경도력이 평형을 이루어 지형류(시계 방향 환류)가 된다고 썼다"] }
    ]
  };
})();
</script>
